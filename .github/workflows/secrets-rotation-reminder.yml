name: Secrets Rotation Verification

# Verifies every secret in the inventory (docs/secrets-policy.md §8,
# backend/scripts/secrets-rotation-status.json) has been rotated within its
# max-age window, and opens tracked issues for any secret due for rotation
# within the next 14 days.
on:
  schedule:
    # Weekly — Monday 08:00 UTC.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  verify-rotation:
    name: Verify Secret Rotation Timestamps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Run verification job
        id: verify
        run: ./scripts/verify-secrets-rotation.sh

  open-reminder-issues:
    name: Open Rotation Reminder Issues
    runs-on: ubuntu-latest
    needs: verify-rotation
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Open issues for secrets due within 14 days
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const fs = require('fs');
            const status = JSON.parse(fs.readFileSync('backend/scripts/secrets-rotation-status.json', 'utf8'));
            const warnWindowDays = 14;
            const now = new Date();

            for (const secret of status.secrets) {
              const lastRotated = new Date(secret.lastRotated + 'T00:00:00Z');
              const ageDays = Math.floor((now - lastRotated) / 86400000);
              const remainingDays = secret.maxAgeDays - ageDays;

              if (remainingDays > warnWindowDays) continue;

              const title = `Rotate ${secret.name} (${remainingDays <= 0 ? 'OVERDUE' : `due in ${remainingDays}d`})`;

              const existing = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:secrets-rotation in:title "${secret.name}"`,
              });
              if (existing.data.total_count > 0) {
                console.log(`Skipping ${secret.name}: open reminder issue already exists`);
                continue;
              }

              const body = [
                `\`${secret.name}\` is ${remainingDays <= 0 ? 'overdue' : 'due soon'} for rotation.`,
                '',
                `- Owner: ${secret.owner}`,
                `- Location: ${secret.location}`,
                `- Max age: ${secret.maxAgeDays} days`,
                `- Last rotated: ${secret.lastRotated}`,
                `- Days remaining: ${remainingDays}`,
                '',
                'Follow the rotation procedure in [docs/admin-secret-rotation.md](../blob/main/docs/admin-secret-rotation.md) (or the secret-specific procedure in [docs/secrets-policy.md](../blob/main/docs/secrets-policy.md)), using the dual-secret acceptance window described there for zero-downtime rotation.',
                '',
                'After rotating, update `lastRotated` in `backend/scripts/secrets-rotation-status.json` and close this issue.',
              ].join('\n');

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['secrets-rotation', 'security'],
                assignees: [secret.owner.replace('@', '')],
              });
              console.log(`Opened reminder for ${secret.name}`);
            }

name: Container Scan

# Trivy scanning for container images and IaC (issue #206).
# Blocks merge on fixable CRITICAL CVEs in the third-party base images the
# project runs, and on HIGH/CRITICAL IaC misconfiguration. Exceptions live in
# .trivyignore with a `# expires: YYYY-MM-DD` marker per entry.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/container-scan.yml"
      - ".trivyignore"
      - "docker-compose.yml"
      - "infra/**"
      - "**/Dockerfile"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/container-scan.yml"
      - ".trivyignore"
      - "docker-compose.yml"
      - "infra/**"
      - "**/Dockerfile"
  schedule:
    # Weekly — Monday 06:30 UTC.
    - cron: "30 6 * * 1"

permissions:
  contents: read

jobs:
  trivyignore-expiry:
    name: Validate .trivyignore expiry markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      - run: node scripts/check-trivyignore-expiry.mjs

  image-scan:
    name: Image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: trivyignore-expiry
    strategy:
      fail-fast: false
      matrix:
        # Third-party base images the compose/k8s stacks run.
        image:
          - postgres:17-alpine
          - redis:7-alpine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Trivy image scan — block on fixable CRITICAL
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2  # 0.28.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          output: trivy-${{ strategy.job-index }}.txt

      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: trivy-image-${{ strategy.job-index }}
          path: trivy-${{ strategy.job-index }}.txt
          retention-days: 30

  iac-scan:
    name: IaC misconfig scan (compose + k8s)
    runs-on: ubuntu-latest
    needs: trivyignore-expiry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Trivy config scan — compose
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2  # 0.28.0
        with:
          scan-type: config
          scan-ref: docker-compose.yml
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Trivy config scan — k8s manifests
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2  # 0.28.0
        with:
          scan-type: config
          scan-ref: infra/k8s
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

  posture-report:
    name: Image posture report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: trivyignore-expiry
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Full posture scan (all severities, JSON)
        run: |
          mkdir -p security-reports
          for img in postgres:17-alpine redis:7-alpine; do
            safe=$(echo "$img" | tr '/:' '__')
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image --quiet --format json --output "/dev/stdout" "$img" \
              > "security-reports/${safe}.json" || true
          done
          ls -la security-reports

      - name: Upload posture report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: container-posture-report
          path: security-reports/
          retention-days: 90

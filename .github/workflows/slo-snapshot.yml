name: slo-snapshot

on:
  schedule:
    # Mondays 09:00 UTC — feeds the weekly SLO review (docs/slo.md).
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20

      - name: Install tsx
        run: npx --yes tsx --version

      - name: Run SLO snapshot
        env:
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
          SLO_SNAPSHOT_FILE: ${{ github.workspace }}/slo-snapshots/slo-snapshot.jsonl
        run: npx tsx scripts/slo-snapshot.ts

      - name: Commit snapshot
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403  # v5
        with:
          commit_message: "chore: weekly SLO snapshot"
          file_pattern: slo-snapshots/slo-snapshot.jsonl

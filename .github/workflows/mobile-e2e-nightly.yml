name: Mobile E2E — Nightly

on:
  schedule:
    # 02:00 UTC every night
    - cron: '0 2 * * *'
  workflow_dispatch:

# This workflow runs the Detox smoke suite on a nightly schedule and before
# production releases. It mirrors the mobile-e2e-ios / mobile-e2e-android
# jobs in ci.yml but always runs regardless of path filters.

jobs:
  mobile-e2e-ios-nightly:
    name: Nightly Smoke — iOS
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1
        with:
          xcode-version: latest-stable

      - name: Expo prebuild (iOS)
        run: pnpm expo prebuild --platform ios --non-interactive
        env:
          CI: true

      - name: Build iOS app for simulator
        run: |
          xcodebuild \
            -workspace ios/Amana.xcworkspace \
            -scheme Amana \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=17.5" \
            build \
            | xcpretty --color
        env:
          CI: true

      - name: Boot iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15" | grep "17.5" | head -1 | grep -E -o '\([-A-F0-9]+\)' | tr -d '()')
          xcrun simctl boot "$UDID" || true

      - name: Run Detox smoke tests (iOS)
        run: pnpm test:e2e:ios
        env:
          CI: true

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: nightly-detox-ios-${{ github.run_id }}
          path: mobile/.detox-artifacts/
          retention-days: 14

  mobile-e2e-android-nightly:
    name: Nightly Smoke — Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3

      - name: Cache AVD
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-nightly-Pixel_6_API_34-${{ runner.os }}

      - name: Create AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        run: |
          echo "no" | avdmanager create avd \
            --force \
            --name Pixel_6_API_34 \
            --abi google_apis/x86_64 \
            --package "system-images;android-34;google_apis;x86_64" \
            --device "pixel_6"

      - name: Expo prebuild (Android)
        run: pnpm expo prebuild --platform android --non-interactive
        env:
          CI: true

      - name: Build Android APK (debug)
        run: |
          cd android && ./gradlew assembleDebug assembleAndroidTest -DtestBuildType=debug
        env:
          CI: true

      - name: Start emulator and run Detox smoke tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: Pixel_6_API_34
          script: cd mobile && pnpm test:e2e:android
        env:
          CI: true

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: nightly-detox-android-${{ github.run_id }}
          path: mobile/.detox-artifacts/
          retention-days: 14

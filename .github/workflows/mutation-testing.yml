name: Mutation Testing — Money Math Pilot

on:
  # Weekly run every Monday at 03:00 UTC (off-peak, low CI noise)
  schedule:
    - cron: "0 3 * * 1"

  # Manual trigger for on-demand runs (e.g. after closing a surviving mutant)
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "on-demand mutation check"

jobs:
  mutation-money-math:
    name: StrykerJS — feeComputation + lossAllocation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run StrykerJS mutation pilot
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-value-with-minimum-length-32
        run: pnpm mutation:ci

      - name: Upload mutation HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mutation-report-money-math-${{ github.run_number }}
          path: backend/reports/mutation/money-math/
          retention-days: 30

      - name: Upload mutation JSON report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mutation-json-money-math-${{ github.run_number }}
          path: backend/reports/mutation/money-math/mutation-report.json
          retention-days: 30

      - name: Summarise mutation score in job summary
        if: always()
        run: |
          REPORT="reports/mutation/money-math/mutation-report.json"
          if [ -f "$REPORT" ]; then
            SCORE=$(node -e "
              const r = require('./$REPORT');
              const t = r.mutationScore ?? r.metrics?.mutationScore ?? 'unknown';
              console.log(t);
            " 2>/dev/null || echo "unknown")
            echo "## Mutation score: ${SCORE}%" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Pilot modules: \`feeComputation.ts\` + \`lossAllocation.ts\`" >> $GITHUB_STEP_SUMMARY
            echo "Report artifact: mutation-report-money-math-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See \`docs/mutation-testing-baseline.md\` for triage instructions." >> $GITHUB_STEP_SUMMARY
          else
            echo "Mutation report not found." >> $GITHUB_STEP_SUMMARY
          fi

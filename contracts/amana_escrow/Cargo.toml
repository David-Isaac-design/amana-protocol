[package]
name = "amana_escrow"
version = "0.1.0"
edition = "2024"
description = "Amana Protocol Soroban escrow contract"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Enable this when building the WASM contract artifact
wasm = []

[dependencies]
soroban-sdk = "25.3.0"

# Enable testutils on host builds so integration tests can import `test_fixture`
# without changing `cargo test` flags. WASM builds (target wasm32) keep the
# lean dependency without testutils.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
soroban-sdk = { version = "25.3.0", features = ["testutils"] }

[dev-dependencies]
soroban-sdk = { version = "25.3.0", features = ["testutils"] }
quickcheck = "1.0"
quickcheck_macros = "1.0"
rand = { version = "0.8", features = ["std", "std_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "dispute_flow"
path = "tests/dispute_flow.rs"

[[test]]
name = "property_tests"
path = "tests/property_tests.rs"

[[test]]
name = "storage_golden_tests"
path = "tests/storage_golden_tests.rs"

[[test]]
name = "auth_matrix_tests"
path = "tests/auth_matrix_tests.rs"

[[test]]
name = "dispute_stress_tests"
path = "tests/dispute_stress_tests.rs"


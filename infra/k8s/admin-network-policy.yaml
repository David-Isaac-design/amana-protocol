apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: innov8-admin-isolation
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    # Rule 1: Allow ingress from internal frontend service pods
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 4000
    # Rule 2: Allow admin route access only from trusted internal management / VPN subnets
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
        - ipBlock:
            cidr: 172.16.0.0/12
      ports:
        - protocol: TCP
          port: 4000

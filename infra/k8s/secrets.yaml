apiVersion: v1
kind: Secret
metadata:
  name: innov8-secrets
  namespace: default
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "secure-database-password-placeholder"
  REDIS_PASSWORD: "secure-redis-password-placeholder"
  JWT_SECRET: "secure-jwt-secret-at-least-32-chars-long"
  PINATA_API_KEY: "pinata-api-key-placeholder"
  PINATA_SECRET: "pinata-secret-placeholder"
  PINATA_JWT: "pinata-jwt-placeholder"
  IPFS_URL_SIGNING_SECRET: "ipfs-signing-secret-placeholder"
  # ADMIN_SECRET_KEY: managed via AWS Secrets Manager (Terraform module: secrets).
  # In production this is synced via External Secrets Operator or AWS CSI driver.
  # Do NOT hard-code the real value here. Use:
  #   kubectl create secret generic innov8-secrets --from-literal=ADMIN_SECRET_KEY=<value>
  # or rely on the ExternalSecret CR to populate it from AWS Secrets Manager.
  ADMIN_SECRET_KEY: "SDXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"


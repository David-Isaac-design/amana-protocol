apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: default
  labels:
    app: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: kingfrankhood/innov8-backend:latest
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: innov8-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: innov8-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: innov8-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/innov8"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: innov8-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis-service:6379/0"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: innov8-secrets
                  key: JWT_SECRET
            - name: PINATA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: innov8-secrets
                  key: PINATA_API_KEY
            - name: PINATA_SECRET
              valueFrom:
                secretKeyRef:
                  name: innov8-secrets
                  key: PINATA_SECRET
            - name: PINATA_JWT
              valueFrom:
                secretKeyRef:
                  name: innov8-secrets
                  key: PINATA_JWT
            - name: IPFS_URL_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: innov8-secrets
                  key: IPFS_URL_SIGNING_SECRET
            - name: ADMIN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: innov8-secrets
                  key: ADMIN_SECRET_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Startup probe: gives the container time to initialise before
          # liveness/readiness take over. Uses /health/startup which checks
          # critical deps + config + admin signing key.
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          # Liveness probe: process-only truth. Restarts the pod on failure.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          # Readiness probe: critical deps (DB + Redis). During graceful
          # shutdown the endpoint returns 503 so traffic stops routing to
          # this pod before it drains in-flight requests.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Give the pod a grace window (before SIGTERM) to let the
            # readiness probe flip to 503 and de-list from the load
            # balancer, preventing 5xx during the drain window.
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
      # Tune termination grace to accommodate: preStop sleep (10s) + interval
      # between preStop and SIGTERM + bounded drain (<30s). Explicit value
      # guarantees the orchestrator's force-exit timer fires before the
      # kubelet kills the container.
      terminationGracePeriodSeconds: 45

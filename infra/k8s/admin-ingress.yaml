apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: innov8-admin-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Restrict ingress to trusted internal corporate / VPN CIDRs
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/16,172.16.0.0/12,192.168.1.0/24"
spec:
  tls:
    - hosts:
        - "admin.internal.amanavault.com"
      secretName: amanavault-admin-tls
  rules:
    - host: "admin.internal.amanavault.com"
      http:
        paths:
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 4000
